<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Estima · Project Costing</title>
  <meta name="description" content="Project costing, made clear.">
  <style>
    :root{--ink:#18211e;--muted:#69736f;--line:#dfe5e1;--paper:#f4f6f3;--white:#fff;--green:#1d5c48;--deep:#153b31;--lime:#d9f27c;--orange:#ef8c4d;--red:#a23e2f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.side{position:sticky;top:0;height:100vh;background:var(--deep);color:#edf5f1;padding:28px 20px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 28px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--lime);color:var(--deep);font-size:20px;font-weight:850}.brand strong,.brand small{display:block}.brand strong{font-size:18px}.brand small{color:#9eb7ae;font-size:11px;margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8cac3;padding:12px;border-radius:10px;display:flex;gap:12px;text-align:left}.nav button span{font:10px Consolas,monospace;color:#73958a}.nav button.active{background:#265245;color:white}.nav button.active span{color:var(--lime)}.side-foot{margin-top:auto;border-top:1px solid #346055;padding:19px 8px 0;color:#aac0b8;font-size:12px;line-height:1.5}.side-foot b{display:block;color:#e7f0ed;font-weight:500}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:8px}.dot.dirty{background:var(--orange)}.workspace{min-width:0}.top{height:92px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.eyebrow{font:700 10px Consolas,monospace;letter-spacing:.13em;color:#75807b;margin:0 0 7px}.top h1{font-size:25px;letter-spacing:-.04em;margin:0}.actions{display:flex;gap:9px}.btn{border-radius:10px;padding:10px 15px;font-size:13px;font-weight:650}.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.primary{background:var(--green);border:1px solid var(--green);color:white}.content{max-width:1260px;margin:auto;padding:36px 4vw 64px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:24px}.maincol{display:grid;gap:20px}.hero{background:#f0e8db;border:1px solid #e4dacb;border-radius:18px;padding:28px 30px;display:flex;align-items:end;justify-content:space-between;min-height:158px}.pill{font:700 10px Consolas,monospace;background:#fff8ed;border:1px solid #dfd1bd;border-radius:99px;padding:6px 9px;color:#74543a}.hero h2,.intro h2{font-size:30px;letter-spacing:-.045em;margin:18px 0 5px}.hero p,.intro p{color:#756b60;margin:0;font-size:13px}.progress{width:160px;font-size:11px}.progress strong{float:right}.progress div{height:5px;background:#d8cebf;border-radius:5px;margin-top:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric,.panel,.recap{background:white;border:1px solid var(--line);border-radius:15px;padding:19px}.metric span,.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:24px;letter-spacing:-.04em;margin:12px 0 5px}.metric.accent{background:#dff0e9;border-color:#c9e4d9}.panel{padding:24px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.heading h3,.recap h3{margin:0;font-size:18px}.textbtn{border:0;background:none;color:var(--green);font-size:12px;font-weight:650}.costrow{width:100%;display:grid;grid-template-columns:9px 1fr auto 42px;align-items:center;gap:12px;padding:14px 0;border:0;border-top:1px solid #edf0ee;background:transparent;text-align:left}.costrow i{height:29px;border-radius:5px;background:var(--green)}.costrow:nth-of-type(2) i{background:#e29a5d}.costrow:nth-of-type(3) i{background:#8c9f98}.costrow:nth-of-type(4) i{background:#8da9cc}.costrow:nth-of-type(5) i{background:#a78bb5}.costrow strong,.costrow small{display:block}.costrow small{font-size:11px;color:var(--muted);margin-top:3px}.costrow b{font-size:13px}.costrow em{font:11px Consolas,monospace;color:var(--muted);font-style:normal;text-align:right}.recap{position:sticky;top:20px;height:max-content;padding:24px}.recap dl{margin:18px 0}.recap dl div{display:flex;justify-content:space-between;padding:10px 0;color:var(--muted);font-size:12px}.recap dd{margin:0;color:var(--ink);font-weight:700}.recap .profit{border-top:1px solid var(--line);margin-top:6px;padding-top:16px}.recap .profit dd{color:var(--green)}.total{background:var(--deep);color:white;border-radius:13px;padding:18px;margin:20px 0 12px}.total span,.total small{display:block}.total span,.total small{color:#bdd0c9;font-size:11px}.total strong{display:block;font-size:29px;margin:9px 0}.wide{width:100%;background:var(--lime);border-color:var(--lime);color:var(--deep)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px 20px}.formgrid label,.price-label{display:grid;gap:7px;color:var(--muted);font-size:11px;font-weight:650}.formgrid input,.price-label input,td input,td select{width:100%;border:1px solid var(--line);background:#fbfcfb;color:var(--ink);border-radius:8px;padding:10px;outline:none}.formgrid input:focus,.price-label input:focus,td input:focus,td select:focus{border-color:#6a9c8c;box-shadow:0 0 0 3px #dceae5}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:27px}.intro h2{margin:0 0 6px}.section-total{text-align:right}.section-total span,.section-total strong{display:block}.section-total span{font-size:11px;color:var(--muted)}.section-total strong{font-size:28px;margin-top:6px}.tablecard{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.scroll{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th{padding:13px 14px;background:#eef2ef;color:#66716c;font:700 10px Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;text-align:left}td{padding:9px;border-top:1px solid #edf0ee}td:first-child{width:42%;padding-left:17px}td:nth-child(2){width:9%}td:nth-child(3),td:nth-child(4){width:14%}td input,td select{border-color:transparent;background:transparent;padding:8px}.ext{text-align:right;font-weight:700;white-space:nowrap}.del{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#a98e86;font-size:20px}.del:hover{background:#fff0ec;color:var(--red)}tfoot td{font-weight:750;background:#fafbf9}tfoot td:first-child{text-align:right;color:var(--muted)}.add{margin:15px 18px;border:1px dashed #b9c8c1;background:#f7faf8;color:var(--green);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:650}.formula{display:flex;gap:13px;margin-top:16px;background:#e7f0ec;border:1px solid #d4e4dd;border-radius:13px;padding:16px 18px;color:#34584c}.formula b{font-size:12px}.formula p{font-size:11px;margin:4px 0 0}.recapgrid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px}.summaryline{display:flex;justify-content:space-between;border-top:1px solid #edf0ee;padding:13px 2px;font-size:13px}.summaryline.final{border-top:2px solid var(--ink);font-weight:800}.systemrow{display:grid;grid-template-columns:75px 1fr 100px 38px;align-items:center;gap:10px;padding:9px 0;font-size:11px}.systemrow div{height:7px;background:#edf1ef;border-radius:7px;overflow:hidden}.systemrow i{display:block;height:100%;background:#6b9788}.systemrow strong{text-align:right}.systemrow em{font:10px Consolas,monospace;color:var(--muted);font-style:normal;text-align:right}.pricing{background:var(--deep);color:white;border-radius:17px;padding:26px;height:max-content}.pricing h3{margin:0 0 22px}.price-label{grid-template-columns:1fr 92px;align-items:center;margin:12px 0;color:#c7d7d1}.price-label div{position:relative}.price-label input{background:#285247;border-color:#416b60;color:white;text-align:right;padding-right:26px}.price-label i{position:absolute;right:10px;top:10px;color:#a9c0b8;font-style:normal}.math{border-top:1px solid #356057;margin-top:22px;padding-top:13px}.math div{display:flex;justify-content:space-between;padding:7px 0;color:#bbcec7;font-size:11px}.math b{color:white}.hidden{display:none!important}.back{margin-bottom:18px}.empty{padding:35px;text-align:center;color:var(--muted)}
    .phase-editor{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.phase-editor summary{cursor:pointer;color:var(--green);font-size:12px;font-weight:700}.phase-editor p{margin:8px 0 12px;color:var(--muted);font-size:11px;line-height:1.5}.phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.phase-grid label{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:7px;color:var(--muted);font:10px Consolas,monospace}.phase-grid input{width:100%;border:1px solid var(--line);background:#fbfcfb;color:var(--ink);border-radius:8px;padding:8px 9px}.phase-grid input:focus{border-color:#6a9c8c;outline:0;box-shadow:0 0 0 3px #dceae5}.tablecard table{min-width:820px}.tablecard td:first-child{width:34%}.tablecard td:nth-child(2){width:23%}.tablecard td:nth-child(3),.tablecard td:nth-child(4){width:12%}.systemrow{grid-template-columns:145px 1fr 100px 38px}
    @media(max-width:900px){.app{grid-template-columns:76px 1fr}.side{padding:24px 10px}.brand div{display:none}.nav button{justify-content:center;font-size:0}.nav button span{font-size:10px}.side-foot{display:none}.grid,.recapgrid{grid-template-columns:1fr}.recap{position:static}.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:span 2}}
    @media(max-width:620px){.app{display:block}.side{height:auto;position:static;padding:10px;display:block}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:54px}.top{height:auto;padding:15px}.top .ghost{display:none}.content{padding:20px 14px}.hero,.intro{display:block}.progress,.section-total{margin-top:18px;width:100%;text-align:left}.metrics,.formgrid{grid-template-columns:1fr}.metric:last-child{grid-column:auto}.recapgrid{grid-template-columns:1fr}}
    @media print{.side,.top .actions,.del,.add,.formula{display:none!important}.app{display:block}.content{padding:15px}.pricing{background:white;color:var(--ink);border:1px solid var(--line)}.pricing .math b{color:var(--ink)}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><span class="mark">E</span><div><strong>Estima</strong><small>Project costing</small></div></div><nav class="nav" id="nav"></nav><div class="side-foot"><span class="dot" id="dot"></span><span id="saveState">Estimate saved</span><b id="itemCount">0 cost items · CAD</b></div></aside>
  <section class="workspace"><header class="top"><div><p class="eyebrow" id="quoteHead">ESTIMATE · DRAFT</p><h1 id="jobHead">Untitled estimate</h1></div><div class="actions"><button class="btn ghost" onclick="location.href='../'">Takeoff</button><button class="btn ghost" onclick="window.print()">Print / PDF</button><button class="btn primary" id="saveBtn">Saved</button></div></header><main class="content" id="content"></main></section>
</div>
<script>
const SECTIONS={labour:{title:'Labour',sub:'Site and fabrication hours',qty:'Hours',rate:'Loaded rate'},materials:{title:'Materials',sub:'Quoted and line material',qty:'Quantity',rate:'Unit cost'},equipment:{title:'Equipment',sub:'Large equipment and specialties',qty:'Quantity',rate:'Unit cost'},rentals:{title:'Rentals',sub:'External rental equipment',qty:'Duration',rate:'Period rate'},subcontractors:{title:'Subcontractors',sub:'External carried quotations',qty:'Quantity',rate:'Carried price'}};
const VIEWS=[['overview','Overview'],...Object.entries(SECTIONS).map(([k,v])=>[k,v.title]),['recap','Recap']];
const DEFAULT_PHASES=['General / Shared','Supply Air','Return Air','Exhaust Air','Outdoor Air','Equipment Connections','Controls','Testing & Balancing','Insulation','Demolition','Piping','Plumbing','Heating','Cooling','Fabrication','Site Work','Equipment','Rentals','Subcontractors','Other'];
const initial={project:{job:'',customer:'',estimator:'',quote:'',trade:'',closing:''},phases:[...DEFAULT_PHASES],overhead:0,contingency:0,margin:0,rows:{labour:[],materials:[],equipment:[],rentals:[],subcontractors:[]}};
function r(description,system,quantity,rate){return{id:crypto.randomUUID(),description,system,quantity,rate}}
let state=load(),view='overview',dirty=false;
function load(){try{const saved=JSON.parse(localStorage.getItem('estima-kirt-v2'));if(!saved)return structuredClone(initial);saved.phases=Array.isArray(saved.phases)&&saved.phases.length===20?saved.phases:[...DEFAULT_PHASES];return saved}catch{return structuredClone(initial)}}
const cad=v=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0}).format(v||0);
function totals(){const by={};for(const [k,rows] of Object.entries(state.rows))by[k]=rows.reduce((s,x)=>s+x.quantity*x.rate,0);const direct=Object.values(by).reduce((a,b)=>a+b,0),overhead=direct*state.overhead/100,contingency=direct*state.contingency/100,basis=direct+overhead+contingency,sell=Math.ceil(basis/(1-state.margin/100));const systems=[];for(let s=1;s<=20;s++){const value=Object.values(state.rows).flat().filter(x=>x.system===s).reduce((a,x)=>a+x.quantity*x.rate,0);if(value)systems.push({system:s,value})}return{by,direct,overhead,contingency,basis,sell,profit:sell-basis,systems}}
function markDirty(){dirty=true;document.querySelector('#dot').classList.add('dirty');document.querySelector('#saveState').textContent='Unsaved changes';document.querySelector('#saveBtn').textContent='Save estimate';refreshHead()}
function save(){localStorage.setItem('estima-kirt-v2',JSON.stringify(state));dirty=false;document.querySelector('#dot').classList.remove('dirty');document.querySelector('#saveState').textContent='Estimate saved';document.querySelector('#saveBtn').textContent='Saved'}
function refreshHead(){document.querySelector('#quoteHead').textContent='ESTIMATE · '+(state.project.quote||'DRAFT');document.querySelector('#jobHead').textContent=state.project.job||'Untitled estimate';document.querySelector('#itemCount').textContent=Object.values(state.rows).flat().length+' cost items · CAD'}
function renderNav(){document.querySelector('#nav').innerHTML=VIEWS.map(([k,l],i)=>`<button class="${view===k?'active':''}" onclick="setView('${k}')"><span>${String(i+1).padStart(2,'0')}</span>${l}</button>`).join('')}
function setView(v){view=v;render()}
function render(){renderNav();refreshHead();const t=totals();if(view==='overview')renderOverview(t);else if(view==='recap')renderRecap(t);else renderSection(view,t)}
function renderOverview(t){const p=state.project,complete=Math.round(Object.values(p).filter(Boolean).length/Object.keys(p).length*100);document.querySelector('#content').innerHTML=`<div class="grid"><div class="maincol"><section class="hero"><div><span class="pill">${esc(p.trade||'Trade not set')}</span><h2>Estimate overview</h2><p>${esc(p.customer||'Customer not set')}${p.closing?' · Closing '+new Date(p.closing+'T00:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}):''}</p></div><div class="progress"><span>Estimate setup</span><strong>${complete}%</strong><div><i style="width:${complete}%"></i></div></div></section><div class="metrics">${metric('Direct cost',t.direct,'Across 5 cost groups')}${metric('Cost basis',t.basis,'Overhead + contingency')}${metric('Selling price',t.sell,state.margin+'% gross margin',true)}</div><section class="panel"><div class="heading"><div><p class="eyebrow">PROJECT SETUP</p><h3>Estimate details</h3></div></div><div class="formgrid">${field('customer','Customer')}${field('job','Job name')}${field('estimator','Estimator')}${field('quote','Quote number')}${field('trade','Trade')}${field('closing','Closing date','date')}</div><details class="phase-editor"><summary>Name scopes / phases</summary><p>These names appear in every cost-entry menu and on the recap. Rename them to match the way this job is divided.</p><div class="phase-grid">${state.phases.map((name,i)=>`<label><span>${i+1}</span><input data-phase="${i}" value="${esc(name)}" aria-label="Scope or phase ${i+1} name"></label>`).join('')}</div></details></section><section class="panel"><div class="heading"><div><p class="eyebrow">COST BUILD-UP</p><h3>Where the estimate stands</h3></div><button class="textbtn" onclick="setView('recap')">Open recap →</button></div>${Object.entries(SECTIONS).map(([k,m])=>`<button class="costrow" onclick="setView('${k}')"><i></i><span><strong>${m.title}</strong><small>${m.sub}</small></span><b>${cad(t.by[k])}</b><em>${t.direct?Math.round(t.by[k]/t.direct*100):0}%</em></button>`).join('')}</section></div>${liveRecap(t)}</div>`;bindProject()}
function metric(l,v,n,a){return`<article class="metric ${a?'accent':''}"><span>${l}</span><strong>${cad(v)}</strong><small>${n}</small></article>`}
function field(k,l,type='text'){return`<label>${l}<input data-project="${k}" type="${type}" value="${esc(state.project[k])}"></label>`}
function bindProject(){document.querySelectorAll('[data-project]').forEach(el=>el.oninput=()=>{state.project[el.dataset.project]=el.value;markDirty()});document.querySelectorAll('[data-phase]').forEach(el=>el.oninput=()=>{state.phases[Number(el.dataset.phase)]=el.value;markDirty()})}
function liveRecap(t){return`<aside class="recap"><p class="eyebrow">LIVE RECAP</p><h3>Current estimate</h3><dl><div><dt>Direct costs</dt><dd>${cad(t.direct)}</dd></div><div><dt>Overhead</dt><dd>${cad(t.overhead)}</dd></div><div><dt>Contingency</dt><dd>${cad(t.contingency)}</dd></div><div class="profit"><dt>Gross profit</dt><dd>${cad(t.profit)}</dd></div></dl><div class="total"><span>Proposed price</span><strong>${cad(t.sell)}</strong><small>CAD · before applicable taxes</small></div><button class="btn wide" onclick="setView('recap')">Review estimate</button></aside>`}
function renderSection(k,t){const m=SECTIONS[k],rows=state.rows[k];document.querySelector('#content').innerHTML=`<section class="intro"><div><p class="eyebrow">COST INPUT</p><h2>${m.title}</h2><p>${m.sub}. Assign each line to the scope or phase it belongs to.</p></div><div class="section-total"><span>Section total</span><strong>${cad(t.by[k])}</strong></div></section><section class="tablecard"><div class="scroll"><table><thead><tr><th>Description</th><th>Scope / Phase</th><th>${m.qty}</th><th>${m.rate}</th><th style="text-align:right">Extension</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><input data-id="${x.id}" data-key="description" value="${esc(x.description)}"></td><td><select data-id="${x.id}" data-key="system">${state.phases.map((name,i)=>`<option value="${i+1}" ${x.system===i+1?'selected':''}>${esc(name||'Phase '+(i+1))}</option>`).join('')}</select></td><td><input type="number" min="0" step=".5" data-id="${x.id}" data-key="quantity" value="${x.quantity}"></td><td><input type="number" min="0" step=".01" data-id="${x.id}" data-key="rate" value="${x.rate}"></td><td class="ext">${cad(x.quantity*x.rate)}</td><td><button class="del" onclick="removeRow('${k}','${x.id}')">×</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Section total</td><td class="ext">${cad(t.by[k])}</td><td></td></tr></tfoot></table></div><button class="add" onclick="addRow('${k}')">＋ Add cost item</button></section><section class="formula"><span>ƒ</span><div><b>Calculation used</b><p>Each extension equals ${m.qty.toLowerCase()} × ${m.rate.toLowerCase()}. Totals flow directly into the recap and scope / phase allocation.</p></div></section>`;document.querySelectorAll('[data-id]').forEach(el=>el.onchange=()=>{const row=state.rows[k].find(x=>x.id===el.dataset.id),key=el.dataset.key;row[key]=key==='description'?el.value:Number(el.value)||0;markDirty();renderSection(k,totals())})}
function addRow(k){state.rows[k].push(r('New item',1,1,0));markDirty();render()}
function removeRow(k,id){state.rows[k]=state.rows[k].filter(x=>x.id!==id);markDirty();render()}
function renderRecap(t){document.querySelector('#content').innerHTML=`<section class="intro"><div><p class="eyebrow">COST BY SCOPE / PHASE</p><h2>Estimate recap</h2><p>${esc(state.project.customer)} · ${esc(state.project.job)}</p></div><div class="actions"><button class="btn ghost" onclick="exportData()">Export data</button><button class="btn primary" onclick="window.print()">Print / PDF</button></div></section><div class="recapgrid"><section class="panel"><div class="heading"><div><p class="eyebrow">DIRECT COSTS</p><h3>Cost by section</h3></div></div>${Object.entries(SECTIONS).map(([k,m])=>`<div class="summaryline"><span>${m.title}</span><strong>${cad(t.by[k])}</strong></div>`).join('')}<div class="summaryline final"><span>Direct cost</span><strong>${cad(t.direct)}</strong></div><div class="heading" style="margin-top:30px"><div><p class="eyebrow">SCOPE / PHASE ALLOCATION</p><h3>Active scopes and phases</h3></div></div>${t.systems.length?t.systems.map(s=>`<div class="systemrow"><span>${esc(state.phases[s.system-1]||'Phase '+s.system)}</span><div><i style="width:${Math.max(4,s.value/t.direct*100)}%"></i></div><strong>${cad(s.value)}</strong><em>${Math.round(s.value/t.direct*100)}%</em></div>`).join(''):'<div class="empty">No costs have been assigned yet.</div>'}</section><aside class="pricing"><p class="eyebrow">PRICING ASSUMPTIONS</p><h3>Build the selling price</h3>${priceField('overhead','Overhead on direct cost')}${priceField('contingency','Contingency')}${priceField('margin','Target gross margin')}<div class="math"><div><span>Direct cost</span><b>${cad(t.direct)}</b></div><div><span>Overhead</span><b>${cad(t.overhead)}</b></div><div><span>Contingency</span><b>${cad(t.contingency)}</b></div><div><span>Cost basis</span><b>${cad(t.basis)}</b></div><div><span>Gross profit</span><b>${cad(t.profit)}</b></div></div><div class="total"><span>Proposed price</span><strong>${cad(t.sell)}</strong><small>Sell = cost basis ÷ (1 − margin)</small></div></aside></div>`;document.querySelectorAll('[data-price]').forEach(el=>el.onchange=()=>{state[el.dataset.price]=Math.min(99,Math.max(0,Number(el.value)||0));markDirty();renderRecap(totals())})}
function priceField(k,l){return`<label class="price-label"><span>${l}</span><div><input data-price="${k}" type="number" min="0" max="99" step=".5" value="${state[k]}"><i>%</i></div></label>`}
function exportData(){const blob=new Blob([JSON.stringify({...state,totals:totals()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.project.quote||'estimate')+'-'+(state.project.job||'project').replace(/\W+/g,'-').toLowerCase()+'.json';a.click();URL.revokeObjectURL(a.href)}
function esc(v=''){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.querySelector('#saveBtn').onclick=save;render();
</script>
</body>
</html>
